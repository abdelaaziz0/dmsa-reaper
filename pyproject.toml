[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmsa-reaper"
version = "0.6.0.dev0"
description = "BadSuccessor and dMSA Ouroboros tooling for Active Directory engagements"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "dMSA-Reaper contributors" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "ldap3>=2.10.2rc4,<2.11",
    "impacket>=0.13.0",
    "cryptography>=39.0",
    "kerbad>=0.5.10",
    "gssapi>=1.9.0; platform_system != 'Windows'",
    "winkerberos>=0.12.0; platform_system == 'Windows'",
]

[project.scripts]
dmsa-reaper = "dmsa_reaper.cli:app"

[tool.setuptools.packages.find]
include = ["dmsa_reaper*"]
