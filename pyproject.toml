[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmsa-reaper"
version = "0.5.0.dev0"
description = "dMSA abuse-path mapper and controlled primitive executor for authorized AD assessments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "dMSA-Reaper contributors" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "ldap3>=2.9.1",
    "impacket>=0.13.0",
    "dnspython>=2.6.0",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
dmsa-reaper = "dmsa_reaper.cli:app"

[tool.setuptools.packages.find]
include = ["dmsa_reaper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
