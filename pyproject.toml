[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmsa-reaper"
version = "0.5.0.dev0"
description = "BadSuccessor exploitation tool for Active Directory engagements"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "dMSA-Reaper contributors" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "ldap3>=2.9.1",
    "impacket>=0.13.0",
    "gssapi>=1.9.0; platform_system != 'Windows'",
    "winkerberos>=0.12.0; platform_system == 'Windows'",
]

[project.scripts]
dmsa-reaper = "dmsa_reaper.cli:app"

[tool.setuptools.packages.find]
include = ["dmsa_reaper*"]
